name: Homelab owned UI checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owned-ui:
    if: github.repository == 'benbernard/happier' && github.actor == 'benbernard' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64, happier-ui]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Check exact source
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - name: Activate Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn --version
      - name: Install frozen UI dependencies
        env:
          HAPPIER_INSTALL_SCOPE: ui,protocol,agents,cli-common,release-runtime,transfers,connection-supervisor,audio-stream-native,sherpa-native
          HAPPIER_UI_VENDOR_WEB_ASSETS: '0'
          HAPPIER_EAS_ENSURE_UI_WORKSPACES_BUILT: '1'
        run: |
          unset HAPPIER_PUBLIC_SERVER_URL HAPPIER_LOCAL_SERVER_URL EXPO_PUBLIC_HAPPY_SERVER_URL
          yarn install --frozen-lockfile --non-interactive
      - name: Typecheck and UI regression tests
        run: |
          unset HAPPIER_PUBLIC_SERVER_URL HAPPIER_LOCAL_SERVER_URL EXPO_PUBLIC_HAPPY_SERVER_URL
          yarn workspace @happier-dev/app typecheck
          yarn workspace @happier-dev/app vitest run \
            sources/components/sessions/agentInput \
            sources/components/sessions/transcript/MessageView.timestamps.test.tsx \
            sources/components/sessions/transcript/messageActions/MessageActionRow.test.tsx \
            sources/sync/domains/settings/settings.spec.ts \
            sources/components/ui/forms/MultiTextInput.test.tsx \
            sources/components/sessions/new/components/NewSessionSimplePanel.keyboardScaffold.test.tsx \
            sources/components/sessions/actions/SessionHeaderActionMenu.sessionHandoff.test.tsx \
            sources/components/sessions/shell/SessionView.infoNavigation.test.tsx \
            sources/components/sessions/shell/SessionItem.contextMenu.suppressPress.test.tsx --maxWorkers=2
